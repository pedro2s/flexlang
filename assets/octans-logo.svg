<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0C10" />
            <stop offset="100%" stop-color="#1F2833" />
        </linearGradient>

        <!-- Cor do corpinho do polvo (Ciano vibrante) -->
        <linearGradient id="octopusBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#66FCF1" />
            <stop offset="100%" stop-color="#45A29E" />
        </linearGradient>
    </defs>

    <!-- Fundo -->
    <rect width="120" height="120" rx="24" fill="url(#bgGrad)" />

    <g transform="translate(0, 5)">
        <!-- Tentáculos gordinhos (Atrás do corpo) -->
        <!-- Tentáculo Esquerdo -->
        <path d="M 35 60 C 20 80, 20 100, 35 90 C 45 85, 45 70, 45 60" fill="url(#octopusBody)" />
        <!-- Tentáculo Direito -->
        <path d="M 85 60 C 100 80, 100 100, 85 90 C 75 85, 75 70, 75 60" fill="url(#octopusBody)" />
        <!-- Tentáculo Centro-Esquerda -->
        <path d="M 45 70 C 40 95, 55 105, 55 90 C 55 80, 55 70, 55 70" fill="url(#octopusBody)" />
        <!-- Tentáculo Centro-Direita -->
        <path d="M 75 70 C 80 95, 65 105, 65 90 C 65 80, 65 70, 65 70" fill="url(#octopusBody)" />

        <!-- Cabeça arredondada (O formato gordinho/fofo) -->
        <ellipse cx="60" cy="55" rx="35" ry="30" fill="url(#octopusBody)" />

        <!-- Olho Esquerdo (Grande estilo Disney) -->
        <ellipse cx="48" cy="50" rx="7" ry="9" fill="#FFFFFF" />
        <!-- Pupila Esquerda -->
        <ellipse cx="50" cy="50" rx="4" ry="5.5" fill="#0B0C10" />
        <!-- Brilho do Olho Esquerdo (O toque da fofura) -->
        <circle cx="48.5" cy="47" r="1.5" fill="#FFFFFF" />

        <!-- Olho Direito -->
        <ellipse cx="72" cy="50" rx="7" ry="9" fill="#FFFFFF" />
        <!-- Pupila Direita -->
        <ellipse cx="70" cy="50" rx="4" ry="5.5" fill="#0B0C10" />
        <!-- Brilho do Olho Direito -->
        <circle cx="71.5" cy="47" r="1.5" fill="#FFFFFF" />

        <!-- Sorrisinho (Super discreto e fofo) -->
        <path d="M 55 65 Q 60 69 65 65" fill="none" stroke="#1F2833" stroke-width="2.5"
            stroke-linecap="round" />

        <!-- Bochechas rosadas (Opcional, dá um ar mais simpático) -->
        <ellipse cx="38" cy="58" rx="4" ry="2.5" fill="#45A29E" opacity="0.6" />
        <ellipse cx="82" cy="58" rx="4" ry="2.5" fill="#45A29E" opacity="0.6" />
    </g>
</svg>